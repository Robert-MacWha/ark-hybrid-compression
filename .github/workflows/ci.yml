name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: cachix/install-nix-action@v31
    - uses: nix-community/cache-nix-action@v7
      with:
        primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}

    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: "crates"

    - run: nix develop .#ci

    - run: nix develop .#ci --command bash -c "cd contracts && forge install foundry-rs/forge-std@v1.16.2 --no-git --shallow && forge build"
    - run: nix develop .#ci --command bash -c "cd contracts && forge test"

    - run: nix develop .#ci --command bash -c "cd crates && cargo check --all-targets --all-features"
    - run: nix develop .#ci --command bash -c "cd crates && cargo fmt --all -- --check"
    - run: nix develop .#ci --command bash -c "cd crates && cargo clippy --all-targets --all-features -- -D warnings"
    - run: nix develop .#ci --command bash -c "cd crates && cargo test --all-targets --all-features"
    - run: nix develop .#ci --command bash -c "cd crates && cargo test --doc --all-features"
