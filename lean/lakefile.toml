name = "hybrid-compression"
defaultTargets = ["HybridCompression"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.35.0"

[[require]]
name = "ark-r1cs"
git = "https://github.com/Robert-MacWha/lean-ark-r1cs"
subDir = "lean"
rev = "a4fdea3990a8cc3f3fe32446a0be0f39375b4bd2"

[[lean_lib]]
name = "HybridCompression"
