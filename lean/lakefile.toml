name = "hybrid-compression"
defaultTargets = ["HybridCompression"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.35.0"

[[require]]
name = "ark-r1cs"
git = "https://github.com/Robert-MacWha/lean-ark-r1cs"
subDir = "lean"
rev = "a264538f0a6b065aff9f3dd0045df4c2e706170c"

[[lean_lib]]
name = "HybridCompression"
